<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEPARATION — does the architecture matter?</title>
<link rel="icon" href="../site/mark.svg" type="image/svg+xml">
<style>
  :root{
    /* Same tokens as the site (site/app.css), duplicated deliberately: this file is inlined whole
       into the published artifact, so it must carry its own styles. */
    --void:#06090D; --scope:#0B1219; --rule:#1A2530; --chart:#E6E1D6; --dim:#62788C;
    --phosphor:#2FF08A; --ra:#FF4D3D;
    --warn:#FFB340;                       /* traffic advisory amber — no site equivalent */
    --approach:#4DA3FF; --flow:#C77DFF;   /* participant colours: these encode who decided what */
    --raise:#131C26;                      /* the one raised surface: tabs, buttons */
    --mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--void);color:var(--chart);
    font:13px/1.5 var(--mono);overflow:hidden}
  header{display:flex;align-items:center;gap:18px;padding:9px 16px;border-bottom:1px solid var(--rule)}
  h1{font-size:14px;margin:0;letter-spacing:.14em;text-transform:uppercase}
  .home{display:flex;align-items:center;color:var(--chart);flex:none;text-decoration:none}
  .home svg{width:60px;height:24px}
  .home:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--phosphor);outline-offset:3px}
  .sub{color:var(--dim);font-size:11px}
  .tabs{margin-left:auto;display:flex;gap:6px}
  .tab{background:var(--scope);border:1px solid var(--rule);color:var(--dim);border-radius:4px;
    padding:5px 11px;font:inherit;font-size:11px;cursor:pointer}
  .tab.on{color:var(--chart);border-color:var(--dim);background:var(--raise)}
  main{height:calc(100vh - 44px);overflow:hidden}
  .hidden{display:none!important}

  /* ── A/B ─────────────────────────────────────────────────────────── */
  .ab{display:grid;grid-template-rows:auto 1fr auto;height:100%}
  .abhead{padding:12px 16px 6px;border-bottom:1px solid var(--rule)}
  .abhead h2{margin:0 0 3px;font-size:15px;letter-spacing:.02em}
  .abpanes{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);min-height:0}
  .pane{background:var(--void);display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0}
  .panetop{padding:9px 14px 7px}
  .panelabel{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .verdict{font-size:15px;font-weight:600;margin-top:3px}
  .verdict.bad{color:var(--ra)} .verdict.good{color:var(--phosphor)}
  .panebottom{padding:8px 14px 12px;font-size:11px;color:var(--dim);border-top:1px solid var(--rule)}
  .cmd{color:var(--chart)}
  .cmd.changed{color:var(--phosphor)}
  canvas{width:100%;height:100%;display:block}
  .controls{display:flex;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--rule);background:var(--scope)}
  button{background:var(--raise);color:var(--chart);border:1px solid var(--rule);border-radius:4px;
    padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--dim)}
  input[type=range]{flex:1;accent-color:var(--phosphor)}
  .t{color:var(--dim);font-variant-numeric:tabular-nums;min-width:96px}

  /* ── recorded run ────────────────────────────────────────────────── */
  .run{display:grid;grid-template-columns:1fr 380px;height:100%}
  .runleft{display:grid;grid-template-rows:auto 1fr auto;min-width:0}
  .strip{padding:10px 16px 12px;background:var(--scope);border-bottom:1px solid var(--rule)}
  .striplabel{color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}
  .bars{position:relative;height:58px}
  .bar{position:absolute;height:18px;border-radius:3px;display:flex;align-items:center;
    padding:0 7px;font-size:10px;color:var(--void);font-weight:600;white-space:nowrap;overflow:hidden}
  .overlap{position:absolute;top:0;bottom:0;background:color-mix(in srgb, var(--warn) 16%, transparent);
    border-left:1px solid var(--warn);border-right:1px solid var(--warn)}
  .overlaplabel{position:absolute;top:-3px;font-size:10px;color:var(--warn)}
  .legend{display:flex;gap:14px;font-size:10px;color:var(--dim);margin-top:7px}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .log{border-left:1px solid var(--rule);background:var(--scope);overflow-y:auto;padding:10px 12px}
  .ev{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:2px 0;color:var(--dim);font-size:11px}
  .ev.on{color:var(--chart)} .ev .ty{color:var(--approach)}
  .beat{margin:6px 0;padding:7px 9px;border-left:2px solid var(--warn);background:var(--scope);font-size:11.5px}
  .beat.objection{border-color:var(--flow)} .beat.narrowed{border-color:var(--phosphor)}
  .beat.loss{border-color:var(--ra)}
  .diff{margin:8px 0;padding:10px 11px;border:1px solid var(--rule);border-left:2px solid var(--phosphor);
    background:var(--scope);font-size:11.5px}
  .diff .ttl{color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-size:10px;margin-bottom:6px}
  .diff .row{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:1px 0}
  .diff .k{color:var(--dim)}
  .was{color:var(--ra);text-decoration:line-through}
  .now{color:var(--phosphor)}
  .why{color:var(--flow);font-style:italic;margin-top:6px}
  .err{padding:24px;color:var(--warn);max-width:70ch;line-height:1.7}
</style>

<header>
  <a class="home" href="../" aria-label="SEPARATION, home">
    <svg viewBox="0 0 240 96" fill="none" aria-hidden="true">
      <g stroke="currentColor" stroke-width="1.25" opacity=".55"><circle cx="48" cy="48" r="29"/><circle cx="192" cy="48" r="29"/></g>
      <g fill="currentColor"><rect x="45" y="45" width="6" height="6"/><rect x="189" y="45" width="6" height="6"/></g>
      <g stroke="var(--phosphor)" stroke-width="1.25"><path d="M77 48 H113"/><path d="M127 48 H163"/><path d="M77 40 V56"/><path d="M163 40 V56"/></g>
      <text x="120" y="52" text-anchor="middle" fill="var(--phosphor)" font-family="ui-monospace, Menlo, monospace" font-size="13">3.0</text>
    </svg>
  </a>
  <h1>Separation</h1>
  <span class="sub" id="meta">loading…</span>
  <div class="tabs">
    <button class="tab on" id="tab-ab" aria-pressed="true">Does the architecture matter?</button>
    <button class="tab" id="tab-run" aria-pressed="false">The recorded run</button>
  </div>
</header>

<main>
  <div class="ab" id="view-ab">
    <div class="abhead">
      <h2>One seed. One integrator. Two architectures.</h2>
      <div class="sub" id="absub"></div>
    </div>
    <div class="abpanes">
      <div class="pane">
        <div class="panetop">
          <div class="panelabel" id="lab-b"></div>
          <div class="verdict" id="ver-b"></div>
        </div>
        <canvas id="scope-b" role="img" aria-label="Plan view, concurrent with validate-at-commit: the arm that loses separation."></canvas>
        <div class="panebottom" id="cmd-b"></div>
      </div>
      <div class="pane">
        <div class="panetop">
          <div class="panelabel" id="lab-c"></div>
          <div class="verdict" id="ver-c"></div>
        </div>
        <canvas id="scope-c" role="img" aria-label="Plan view, concurrent with the interlock: the arm that maintains separation."></canvas>
        <div class="panebottom" id="cmd-c"></div>
      </div>
    </div>
    <div class="controls">
      <button id="ab-play">❚❚ pause</button>
      <input type="range" id="ab-scrub" min="0" max="1000" value="0"
           aria-label="Scrub both architectures through the 380-second encounter">
      <span class="t" id="ab-clock">t+0s</span>
    </div>
  </div>

  <div class="run hidden" id="view-run">
    <div class="runleft">
      <div class="strip">
        <div class="striplabel">in flight — overlapping bars mean two agents were thinking at the same time</div>
        <div class="bars" id="bars"></div>
        <div class="legend">
          <span><i class="sw" style="background:var(--approach)"></i>APPROACH</span>
          <span><i class="sw" style="background:var(--flow)"></i>FLOW</span>
          <span><i class="sw" style="background:var(--warn);opacity:.5"></i>both open at once</span>
        </div>
      </div>
      <canvas id="scope" role="img" aria-label="Plan view of the recorded agent run."></canvas>
      <div class="controls">
        <button id="play">▶ play</button>
        <input type="range" id="scrub" min="0" max="1000" value="0"
           aria-label="Scrub the recorded agent run">
        <span class="t" id="clock">t+0.0s</span>
        <button id="jump">jump to the objection</button>
      </div>
    </div>
    <div class="log" id="log"></div>
  </div>
</main>

<script>
/**
 * Renders RECORDED runs. Everything drawn here is a readout of committed fixtures — the A/B from
 * `fixtures/ablation-ab.json`, the agent run from `fixtures/trace.json`. Nothing is simulated in the
 * browser and nothing is drawn that the fixtures do not contain.
 */
const SEP_NM = 3

/** Read a design token, so the canvas and the stylesheet can never disagree about a colour. */
const T = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
/** The same token at an alpha. Canvas has no colour-mix(), so this parses the hex once. */
const A = (n, a) => {
  const h = T(n).replace("#", "")
  const v = parseInt(h.length === 3 ? h.replace(/./g, "$&$&") : h, 16)
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`
}
const $ = (id) => document.getElementById(id)
let ab = null, trace = null
let abT = 0, abPlaying = true, abSpan = 1
let t = 0, playing = false, span = 1

/* ── shared radar drawing, used by both views ───────────────────────── */
function drawScope(cv, frames, tSim, opts = {}) {
  const ctx = cv.getContext("2d")
  const r = cv.getBoundingClientRect()
  const dpr = devicePixelRatio || 1
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) {
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  }
  const w = r.width, h = r.height, cx = w / 2, cy = h / 2
  const scale = Math.min(w, h) / 34

  ctx.fillStyle = T("--void"); ctx.fillRect(0, 0, w, h)
  ctx.strokeStyle = T("--rule"); ctx.lineWidth = 1
  for (let ring = 5; ring <= 25; ring += 5) {
    ctx.beginPath(); ctx.arc(cx, cy, ring * scale, 0, Math.PI * 2); ctx.stroke()
  }
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke()

  let f = null
  for (const fr of frames) { if (fr.tSim <= tSim) f = fr; else break }
  if (!f) return null
  const px = (a) => [cx + a.x * scale, cy - a.y * scale]

  for (const tr of f.tracks) {
    ctx.beginPath(); let started = false
    for (const pf of frames) {
      if (pf.tSim > f.tSim || pf.tSim < f.tSim - 90) continue
      const a = pf.tracks.find((x) => x.callsign === tr.callsign); if (!a) continue
      const [X, Y] = px(a)
      started ? ctx.lineTo(X, Y) : (ctx.moveTo(X, Y), started = true)
    }
    ctx.strokeStyle = A("--phosphor",.22); ctx.stroke()
  }

  let lost = false
  if (f.tracks.length >= 2) {
    const [a, b] = f.tracks
    const range = Math.hypot(a.x - b.x, a.y - b.y)
    lost = range < SEP_NM && Math.abs(a.altFt - b.altFt) < 1000
    for (const tr of [a, b]) {
      const [X, Y] = px(tr)
      ctx.beginPath(); ctx.arc(X, Y, (SEP_NM / 2) * scale, 0, Math.PI * 2)
      ctx.strokeStyle = lost ? A("--ra",.6) : A("--dim",.5)
      ctx.setLineDash([3, 4]); ctx.stroke(); ctx.setLineDash([])
    }
    const mx = (px(a)[0] + px(b)[0]) / 2, my = (px(a)[1] + px(b)[1]) / 2
    ctx.fillStyle = lost ? T("--ra") : T("--dim")
    ctx.font = "11px ui-monospace,Menlo,monospace"
    ctx.textAlign = "center"
    ctx.fillText(range.toFixed(2) + " NM", mx, my - 8)
  }

  for (const tr of f.tracks) {
    const [X, Y] = px(tr)
    ctx.fillStyle = opts.blipColor || T("--phosphor")
    ctx.fillRect(X - 3, Y - 3, 6, 6)
    ctx.fillStyle = T("--chart")
    ctx.font = "10px ui-monospace,Menlo,monospace"
    ctx.textAlign = "left"
    ctx.fillText(tr.callsign, X + 8, Y - 2)
    ctx.fillStyle = T("--dim")
    ctx.fillText(Math.round(tr.altFt) + " ft", X + 8, Y + 9)
  }
  return { lost, tSim: f.tSim }
}

/* ── A/B view ───────────────────────────────────────────────────────── */
function initAB(data) {
  ab = data
  const [b, c] = ab.arms
  abSpan = Math.max(...b.frames.map((f) => f.tSim))
  $("absub").textContent =
    `Both arms fly the same integrator from the same world. The only difference is what each ` +
    `architecture committed — so any divergence you see is the architecture.`
  const fmt = (cmds) => cmds.map((x) => `${x.callsign} ${x.command}`).join("   ")
  $("lab-b").textContent = b.label
  $("lab-c").textContent = c.label
  $("cmd-b").textContent = ""
  $("cmd-c").textContent = ""
  $("cmd-b").append(document.createTextNode("issued:  " + fmt(b.committed)))
  $("cmd-c").append(document.createTextNode("issued:  " + fmt(c.committed)))
  $("ab-scrub").addEventListener("input", (e) => { abPlaying = false; $("ab-play").textContent = "▶ play"; abT = (e.target.value / 1000) * abSpan; drawAB() })
  $("ab-play").addEventListener("click", () => {
    abPlaying = !abPlaying
    $("ab-play").textContent = abPlaying ? "❚❚ pause" : "▶ play"
    if (abT >= abSpan) abT = 0
  })
  drawAB()
}

function drawAB() {
  if (!ab) return
  const [b, c] = ab.arms
  const rb = drawScope($("scope-b"), b.frames, abT)
  const rc = drawScope($("scope-c"), c.frames, abT)
  for (const [arm, res, id] of [[b, rb, "ver-b"], [c, rc, "ver-c"]]) {
    const el = $(id)
    const nowLost = res && res.lost
    if (nowLost) { el.textContent = "SEPARATION LOST"; el.className = "verdict bad" }
    else if (arm.separationLost && abT >= (arm.lostAtSec ?? Infinity)) { el.textContent = "SEPARATION LOST"; el.className = "verdict bad" }
    else { el.textContent = arm.separationLost ? "closing…" : "separation maintained"; el.className = "verdict" + (arm.separationLost ? "" : " good") }
  }
  $("ab-clock").textContent = "t+" + Math.round(abT) + "s"
  $("ab-scrub").value = String(Math.round((abT / abSpan) * 1000))
}

/* ── recorded run ───────────────────────────────────────────────────── */
function overlaps() {
  const end = Math.max(trace.meta.generatedAtTSim, ...trace.turns.map((x) => x.closedS ?? x.openedS))
  const cl = (x) => x.closedS ?? end, out = []
  for (let i = 0; i < trace.turns.length; i++) {
    for (let j = i + 1; j < trace.turns.length; j++) {
      const a = trace.turns[i], b = trace.turns[j]
      const s = Math.max(a.openedS, b.openedS), e = Math.min(cl(a), cl(b))
      if (e > s) out.push({ a, b, from: s, to: e, seconds: e - s })
    }
  }
  return out
}

function drawBars(ov) {
  const host = $("bars"); host.textContent = ""
  const turns = trace.turns
  if (!turns.length) return
  const t0 = Math.min(...turns.map((x) => x.openedS))
  const end = Math.max(trace.meta.generatedAtTSim, ...turns.map((x) => x.closedS ?? x.openedS))
  const w = end - t0 || 1
  const pct = (s) => ((s - t0) / w) * 100
  const COLOR = { APPROACH: T("--approach"), FLOW: T("--flow") }

  for (const o of ov) {
    const band = document.createElement("div")
    band.className = "overlap"
    band.style.left = pct(o.from) + "%"
    band.style.width = (pct(o.to) - pct(o.from)) + "%"
    host.appendChild(band)
    const lab = document.createElement("div")
    lab.className = "overlaplabel"
    lab.style.left = pct(o.from) + "%"
    lab.textContent = o.seconds.toFixed(1) + "s both thinking"
    host.appendChild(lab)
  }
  const rows = [...new Set(turns.map((x) => x.participant))]
  turns.forEach((x) => {
    const el = document.createElement("div")
    el.className = "bar"
    el.style.left = pct(x.openedS) + "%"
    el.style.width = Math.max(1.5, pct(x.closedS ?? end) - pct(x.openedS)) + "%"
    el.style.top = (18 + rows.indexOf(x.participant) * 24) + "px"
    el.style.background = COLOR[x.participant] ?? "var(--approach)"
    el.textContent = x.participant
    host.appendChild(el)
  })
  const head = document.createElement("div")
  head.className = "playhead"
  host.appendChild(head)
}

function renderLog() {
  const host = $("log"); host.textContent = ""
  for (const b of trace.beats) {
    const el = document.createElement("div")
    el.className = "beat " + b.kind
    el.textContent = `t+${Math.round(b.tSim)}s  ${b.text}`
    host.appendChild(el)
    // The rewrite, as data. This is the claim: a peer changed the arguments of a call that was
    // still in flight, and the aircraft flew the changed one.
    if (b.diff) {
      const d = document.createElement("div")
      d.className = "diff"
      const ttl = document.createElement("div")
      ttl.className = "ttl"; ttl.textContent = "arguments rewritten mid-turn"
      d.appendChild(ttl)
      for (const [k, v, cls] of [["proposed", b.diff.from, "was"], ["executed", b.diff.to, "now"]]) {
        const row = document.createElement("div"); row.className = "row"
        const kk = document.createElement("span"); kk.className = "k"; kk.textContent = k
        const vv = document.createElement("span"); vv.className = cls; vv.textContent = v
        row.append(kk, vv); d.appendChild(row)
      }
      const why = document.createElement("div")
      why.className = "why"; why.textContent = "because: " + b.diff.because
      d.appendChild(why)
      host.appendChild(d)
    }
  }
  for (const e of trace.events.slice(0, 400)) {
    const el = document.createElement("div")
    el.className = "ev" + (e.tSim <= t ? " on" : "")
    const a = document.createElement("span"); a.textContent = "t+" + Math.round(e.tSim)
    const b2 = document.createElement("span")
    const ty = document.createElement("span"); ty.className = "ty"; ty.textContent = e.type + " "
    b2.append(ty, document.createTextNode(e.summary || ""))
    el.append(a, b2); host.appendChild(el)
  }
}

function drawRun() {
  if (!trace) return
  drawScope($("scope"), trace.frames, t)
  $("clock").textContent = "t+" + t.toFixed(1) + "s"
  $("scrub").value = String(Math.round((t / span) * 1000))
}

function initRun(data) {
  trace = data
  span = Math.max(...trace.frames.map((f) => f.tSim))
  const ov = overlaps()
  $("meta").textContent =
    `${trace.meta.scenario} · ${trace.turns.length} turns · ${trace.events.length} events` +
    (ov.length ? ` · ${ov[0].seconds.toFixed(1)}s of simultaneous deliberation` : "")
  drawBars(ov); renderLog(); drawRun()
  $("scrub").addEventListener("input", (e) => { playing = false; $("play").textContent = "▶ play"; t = (e.target.value / 1000) * span; drawRun(); renderLog() })
  $("play").addEventListener("click", () => {
    playing = !playing; $("play").textContent = playing ? "❚❚ pause" : "▶ play"
    if (t >= span) t = 0
  })
  $("jump").addEventListener("click", () => {
    const beat = trace.beats.find((b) => b.kind === "objection") || trace.beats[0]
    if (beat) { playing = false; $("play").textContent = "▶ play"; t = beat.tSim; drawRun(); renderLog() }
  })
}

/* ── tabs + loop ────────────────────────────────────────────────────── */
function show(which) {
  $("view-ab").classList.toggle("hidden", which !== "ab")
  $("view-run").classList.toggle("hidden", which !== "run")
  $("tab-ab").classList.toggle("on", which === "ab")
  $("tab-run").classList.toggle("on", which === "run")
  $("tab-ab").setAttribute("aria-pressed", String(which === "ab"))
  $("tab-run").setAttribute("aria-pressed", String(which === "run"))
  if (which === "ab") drawAB(); else drawRun()
}
$("tab-ab").addEventListener("click", () => show("ab"))
$("tab-run").addEventListener("click", () => show("run"))

let last = performance.now()
function loop(now) {
  const dt = (now - last) / 1000; last = now
  if (abPlaying && ab) { abT = Math.min(abSpan, abT + dt * 26); if (abT >= abSpan) abPlaying = false, $("ab-play").textContent = "▶ play"; drawAB() }
  if (playing && trace) { t = Math.min(span, t + dt * 26); if (t >= span) playing = false, $("play").textContent = "▶ play"; drawRun(); renderLog() }
  requestAnimationFrame(loop)
}
requestAnimationFrame(loop)
addEventListener("resize", () => { drawAB(); drawRun() })

const load = (p) => fetch(p).then((r) => { if (!r.ok) throw new Error(p + " " + r.status); return r.json() })
Promise.all([load("../fixtures/ablation-ab.json"), load("../fixtures/trace.json")])
  .catch(() => Promise.all([load("ablation-ab.json"), load("trace.json")]))
  .then(([a, tr]) => { initAB(a); initRun(tr) })
  .catch((err) => {
    // file:// blocks fetch in every browser. Say so rather than sitting on "loading…".
    document.querySelector("main").textContent = ""
    const p = document.createElement("div"); p.className = "err"
    p.textContent = location.protocol === "file:"
      ? "Open this over HTTP, not file:// — browsers block fetch on file URLs. Run `npm run viewer`."
      : "Could not load the fixtures — run `npm run record:trace` and `npm run record:ablation` first. (" + err + ")"
    document.querySelector("main").appendChild(p)
  })
</script>
